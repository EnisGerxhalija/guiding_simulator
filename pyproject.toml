# Project settings: the project's name, which Python it needs and which
# libraries it uses. Install everything once, inside your .venv, with:
#     python -m pip install -e ".[dev]"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "guiding-simulator"
version = "0.1.0"
description = "Analysis and simulation code for tip/tilt guiding simulator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enis Gerxhalija", email = "eg757@cam.ac.uk" }]

# Libraries the code needs to run.
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.11",
]

# Extra tools for working on the code: tests and Jupyter notebooks.
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ipykernel>=6",
]

# The code lives in src/.
[tool.setuptools.packages.find]
where = ["src"]

# pytest looks for tests in tests/.
[tool.pytest.ini_options]
testpaths = ["tests"]
